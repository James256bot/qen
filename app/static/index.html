  latticePlaying = true;
  const $play = document.getElementById("playBtn");
  $play.textContent = "❚❚ pause";
  latticeTimer = setInterval(() => {
    latticeCurrentFrame = (latticeCurrentFrame + 1);
    if (latticeCurrentFrame >= latticeFrames.length) {
      clearInterval(latticeTimer);
      latticePlaying = false;
      $play.textContent = "▶ play";
      stopRecording();
      $rec.textContent = "● record";
      $rec.style.background = "#21262d";
      $meta.textContent += "  ·  recording saved";
      return;
    }
    drawLatticeFrame(latticeCurrentFrame);
  }, 1000 / fps);
}


// ============================================================
// Minimal GIF encoder (LZW + 256-color palette)
// Adapted from the classic jsgif / gif.js approach.
// ============================================================

function gifEncode(frames, width, height, delayMs) {
  // frames: array of Uint8ClampedArray RGBA pixels (width*height*4)
  const out = [];
  const writeByte = (b) => out.push(b & 0xff);
  const writeShort = (v) => { writeByte(v); writeByte(v >> 8); };
  const writeString = (s) => { for (let i = 0; i < s.length; i++) writeByte(s.charCodeAt(i)); };

  // Header
  writeString("GIF89a");
  // Logical screen descriptor
  writeShort(width);
  writeShort(height);
  writeByte(0xF7);              // global color table, 256 colors
  writeByte(0);                 // background color index
  writeByte(0);                 // pixel aspect ratio

  // Global color table (256-entry grayscale→cyan-ish palette)
  // We'll just use a 6x6x6 = 216-color RGB cube + 40 grays.
  for (let r = 0; r < 6; r++) {
    for (let g = 0; g < 6; g++) {
      for (let b = 0; b < 6; b++) {
        writeByte(Math.round(r * 51));
        writeByte(Math.round(g * 51));
        writeByte(Math.round(b * 51));
      }
    }
  }
  for (let i = 0; i < 40; i++) {
    const v = Math.round(i * 6.375);
    writeByte(v); writeByte(v); writeByte(v);
  }

  // Netscape loop extension (infinite loop)
  writeByte(0x21); writeByte(0xFF); writeByte(0x0B);
  writeString("NETSCAPE2.0");
  writeByte(0x03); writeByte(0x01); writeShort(0); writeByte(0);

  const delayCs = Math.max(2, Math.round(delayMs / 10));

  for (const rgba of frames) {
    // Graphic control extension
    writeByte(0x21); writeByte(0xF9); writeByte(0x04);
    writeByte(0x00);              // no transparency
    writeShort(delayCs);
    writeByte(0x00);              // no transparent color index
    writeByte(0x00);              // block terminator

    // Image descriptor
    writeByte(0x2C);
    writeShort(0); writeShort(0);
    writeShort(width); writeShort(height);
    writeByte(0x00);              // no local color table

    // Convert RGBA to palette indices
    const indices = new Uint8Array(width * height);
    for (let i = 0; i < width * height; i++) {
      const r = rgba[i * 4]     >> 5;   // 0..7 → clamp to 0..5
      const g = rgba[i * 4 + 1] >> 5;
      const b = rgba[i * 4 + 2] >> 5;
      const ri = Math.min(r, 5), gi = Math.min(g, 5), bi = Math.min(b, 5);
      indices[i] = ri * 36 + gi * 6 + bi;
    }

    // LZW encode
    lzwEncode(indices, writeByte);
  }

  writeByte(0x3B);  // trailer
  return new Uint8Array(out);
}

function lzwEncode(pixels, writeByte) {
  const MIN_CODE_SIZE = 8;
  const CLEAR_CODE = 1 << MIN_CODE_SIZE;
  const EOI_CODE = CLEAR_CODE + 1;

  writeByte(MIN_CODE_SIZE);

  let codeSize = MIN_CODE_SIZE + 1;
  let nextCode = EOI_CODE + 1;
  let dict = new Map();
  const resetDict = () => {
    dict = new Map();
    for (let i = 0; i < CLEAR_CODE; i++) dict.set(String(i), i);
    nextCode = EOI_CODE + 1;
    codeSize = MIN_CODE_SIZE + 1;
  };
  resetDict();

  // Bit writer
  let bitBuffer = 0;
  let bitCount = 0;
  const subBlock = [];
  const flushBlock = () => {
    if (subBlock.length === 0) return;
    writeByte(subBlock.length);
    for (const b of subBlock) writeByte(b);
    subBlock.length = 0;
  };
  const emitByte = (b) => {
    subBlock.push(b);
    if (subBlock.length === 255) flushBlock();
  };
  const writeCode = (code) => {
    bitBuffer |= code << bitCount;
    bitCount += codeSize;
    while (bitCount >= 8) {
      emitByte(bitBuffer & 0xff);
      bitBuffer >>= 8;
      bitCount -= 8;
    }
  };

  writeCode(CLEAR_CODE);

  let current = String(pixels[0]);
  for (let i = 1; i < pixels.length; i++) {
    const next = String(pixels[i]);
    const combined = current + "," + next;
    if (dict.has(combined)) {
      current = combined;
    } else {
      writeCode(dict.get(current));
      if (nextCode < 4096) {
        dict.set(combined, nextCode++);
        if (nextCode > (1 << codeSize) && codeSize < 12) codeSize++;
      } else {
        writeCode(CLEAR_CODE);
        resetDict();
      }
      current = next;
    }
  }
  writeCode(dict.get(current));
  writeCode(EOI_CODE);

  // flush bits
  while (bitCount > 0) {
    emitByte(bitBuffer & 0xff);
    bitBuffer >>= 8;
    bitCount -= 8;
  }
  flushBlock();
  writeByte(0);  // block terminator
}

async function exportGIF() {
  if (!latticeFrames || !latticeFrames.length) {
    $err.textContent = "run a 2D lattice simulation first";
    return;
  }
  const $btn = document.getElementById("gifBtn");
  $btn.textContent = "encoding…";
  $btn.disabled = true;

  // Small size for GIF (keep file manageable)
  const W = 200, H = 200;
  const off = document.createElement("canvas");
  off.width = W; off.height = H;
  const octx = off.getContext("2d");

  // Grab original canvas size (we'll redraw lattice frames into the off-screen canvas)
  const origW = canvas.width, origH = canvas.height;

  const framesRGBA = [];
  const savedCurrent = latticeCurrentFrame;
  for (let idx = 0; idx < latticeFrames.length; idx++) {
    // Render the lattice frame to the main canvas, then downscale to off canvas
    drawLatticeFrame(idx);
    octx.drawImage(canvas, 0, 0, origW, origH, 0, 0, W, H);
    framesRGBA.push(octx.getImageData(0, 0, W, H).data);
    // yield to UI every few frames
    if (idx % 4 === 0) await new Promise(r => setTimeout(r, 0));
  }

  // Restore the display to where it was
  drawLatticeFrame(savedCurrent);

  const delayMs = 100;   // 10 fps
  let gifBytes;
  try {
    gifBytes = gifEncode(framesRGBA, W, H, delayMs);
  } catch (e) {
    $err.textContent = "GIF encoding failed: " + e.message;
    $btn.textContent = "save GIF";
    $btn.disabled = false;
    return;
  }

  const blob = new Blob([gifBytes], { type: "image/gif" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `qen_lattice_${Date.now()}.gif`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);

  $btn.textContent = "save GIF";
  $btn.disabled = false;
  $meta.textContent += "  ·  GIF saved (" + Math.round(gifBytes.length / 1024) + " KB)";
}


// ============================================================
// QEN Studio — ask + scenarios
// ============================================================

let scenarioSteps = [];
let scenarioCurrentStep = 0;
let scenarioMeta = null;

async function loadStudio() {
  // Load scenario buttons
  try {
    const res = await fetch("/scenarios");
    const items = await res.json();
    const $btns = document.getElementById("scenarioButtons");
    $btns.innerHTML = "";
    for (const sc of items) {
      const b = document.createElement("button");
      b.textContent = sc.title;
      b.style.cssText = "background:#21262d; color:#e6edf3; border:1px solid #30363d; border-radius:4px; padding:6px 10px; font-size:12px; cursor:pointer;";
      b.addEventListener("click", () => runScenario(sc.id));
      $btns.appendChild(b);
    }
  } catch (e) {
    console.warn("scenarios failed to load", e);
  }
}

async function askQuestion() {
  const prompt = document.getElementById("askInput").value.trim();
  if (!prompt) return;
  document.getElementById("askBtn").textContent = "asking…";
  document.getElementById("askBtn").disabled = true;
  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "ask failed");
    // Render the result on the canvas
    lastResult = data.result;
    lastRunId = null;
    lastCircuitSpec = null;
    const line = draw(data.result);
    {
      const u = new URLSearchParams(location.search);
      u.set("ask", prompt);
      u.delete("scenario");
      u.delete("run");
      history.replaceState(null, "", "?" + u.toString());
    }
    $meta.textContent = `ask: "${prompt}" → ${data.system_type} (${data.compute_time_ms.toFixed(1)} ms)`;
    $raw.textContent = JSON.stringify(data, null, 2);
    // Show narration
    showNarration(data.system_type, data.narration, [data.result]);
  } catch (e) {
    $err.textContent = "ask error: " + e.message;
  } finally {
    document.getElementById("askBtn").textContent = "ask";
    document.getElementById("askBtn").disabled = false;
  }
}

function showNarration(title, text, steps) {
  const nav = document.getElementById("scenarioNav");
  nav.style.display = "block";
  document.getElementById("scenarioTitle").textContent = title;
  document.getElementById("scenarioStep").textContent = "";
  document.getElementById("scenarioNarration").textContent = text;
  document.getElementById("scenarioPrev").style.display = "none";
  document.getElementById("scenarioNext").style.display = "none";
  scenarioSteps = steps;
  scenarioCurrentStep = 0;
}

async function runScenario(id) {
  const nav = document.getElementById("scenarioNav");
  nav.style.display = "block";
  document.getElementById("scenarioTitle").textContent = "loading…";
  document.getElementById("scenarioStep").textContent = "";
  document.getElementById("scenarioNarration").textContent = "";
  document.getElementById("scenarioPrev").style.display = "none";
  document.getElementById("scenarioNext").style.display = "none";

  try {
    const res = await fetch(`/scenarios/${id}/run`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "scenario failed");

    // Collect all steps
    scenarioSteps = data.steps;
    scenarioMeta = data;
    scenarioCurrentStep = 0;

    {
      const u = new URLSearchParams(location.search);
      u.set("scenario", id);
      u.delete("ask");
      u.delete("run");
      history.replaceState(null, "", "?" + u.toString());
    }
    document.getElementById("scenarioTitle").textContent = data.title;
    document.getElementById("scenarioStep").textContent = `(${data.steps.length} steps · ${data.total_compute_ms.toFixed(0)} ms)`;

    renderScenarioStep(0);
  } catch (e) {
    document.getElementById("scenarioNarration").textContent = "scenario error: " + e.message;
  }
}

function renderScenarioStep(idx) {
  if (!scenarioSteps.length) return;
  const step = scenarioSteps[idx];
  scenarioCurrentStep = idx;

  // Update nav
  document.getElementById("scenarioStep").textContent = `step ${idx + 1} of ${scenarioSteps.length}`;
  document.getElementById("scenarioPrev").style.display = idx > 0 ? "inline-block" : "none";
  document.getElementById("scenarioNext").style.display = idx < scenarioSteps.length - 1 ? "inline-block" : "none";

  if (step.kind === "note") {
    document.getElementById("scenarioNarration").textContent = step.text;
  } else if (step.kind === "solve") {
    document.getElementById("scenarioNarration").textContent = `Computing ${step.solver}...`;
    // Render the result
    lastResult = step.result;
    lastCircuitSpec = null;
    const line = draw(step.result);
    $meta.textContent = `${step.solver} · ${step.compute_time_ms.toFixed(1)} ms · ${line}`;
    $raw.textContent = JSON.stringify(step.result, null, 2);
    // If the previous step was a note, show it as context
    const prevNote = scenarioSteps.slice(0, idx).reverse().find(s => s.kind === "note");
    document.getElementById("scenarioNarration").textContent = prevNote ? prevNote.text : "";
  } else if (step.kind === "error") {
    document.getElementById("scenarioNarration").textContent = "Error: " + step.detail;
  }
}

document.getElementById("askBtn").addEventListener("click", askQuestion);
document.getElementById("askInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") askQuestion();
});
document.getElementById("scenarioPrev").addEventListener("click", () => {
  if (scenarioCurrentStep > 0) renderScenarioStep(scenarioCurrentStep - 1);
});
document.getElementById("scenarioNext").addEventListener("click", () => {
  if (scenarioCurrentStep < scenarioSteps.length - 1) renderScenarioStep(scenarioCurrentStep + 1);
});

// Load scenarios after the page is ready
setTimeout(loadStudio, 200);


// ============================================================
// Compare mode — render two solver results side by side
// ============================================================

async function runCompare() {
  const sysA = $sys.value;
  const paramsA = collectParams();
  const sysB = document.getElementById("compareSolver").value;
  let paramsB = {};
  const rawB = document.getElementById("compareParams").value.trim();
  if (rawB) {
    try { paramsB = JSON.parse(rawB); }
    catch (e) {
      $err.textContent = "invalid JSON in compare params";
      return;
    }
  }

  $err.textContent = "";
  $run.disabled = true;
  $run.textContent = "running compare…";

  try {
    // Run both solvers in parallel
    const [resA, resB] = await Promise.all([
      fetch("/simulations/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system_type: sysA, parameters: paramsA }),
      }).then(r => r.json()),
      fetch("/simulations/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system_type: sysB, parameters: paramsB }),
      }).then(r => r.json()),
    ]);

    if (resA.status !== "completed" || resB.status !== "completed") {
      throw new Error("one of the solvers failed");
    }

    drawCompare(resA, resB, sysA, sysB, paramsA, paramsB);
  } catch (e) {
    $err.textContent = "compare error: " + e.message;
  } finally {
    $run.disabled = false;
    $run.textContent = "run simulation";
  }
}

function drawCompare(resA, resB, sysA, sysB, paramsA, paramsB) {
  const W = canvas.width, H = canvas.height;
  const halfW = Math.floor(W / 2) - 6;

  // Save the original canvas state
  const origCanvas = canvas;
  const origCtx = ctx;

  // Create two off-screen canvases, run each renderer on them, then blit to main
  function renderToOffscreen(result, drawFn, width, height) {
    const off = document.createElement("canvas");
    off.width = width;
    off.height = height;
    // Temporarily swap the global canvas and ctx
    const oldCanvas = window.canvas;
    const oldCtx = window.ctx;
    window.canvas = off;
    window.ctx = off.getContext("2d");
    // Also swap the module-level references used inside renderers
    // (they refer to the `canvas` and `ctx` identifiers directly)
    // We rely on `canvas` and `ctx` being global `var`/`let` or `const` at module scope.
    try {
      drawFn(result);
    } catch (e) {
      console.warn("renderer error in compare:", e);
    }
    // restore
    window.canvas = oldCanvas;
    window.ctx = oldCtx;
    return off;
  }

  // Clear the main canvas
  ctx.fillStyle = "#161b22";
  ctx.fillRect(0, 0, W, H);

  // Headers
  ctx.fillStyle = "#8b949e";
  ctx.font = "12px ui-monospace, monospace";
  ctx.fillText(`A: ${sysA}`, 10, 16);
  ctx.fillText(`B: ${sysB}`, halfW + 20, 16);

  // Divider
  ctx.strokeStyle = "#30363d";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(halfW + 10, 0);
  ctx.lineTo(halfW + 10, H);
  ctx.stroke();

  // For each result, render to offscreen and blit
  const renderedA = renderToOffscreen(resA.result, draw, halfW - 4, H - 30);
  const renderedB = renderToOffscreen(resB.result, draw, halfW - 4, H - 30);
  ctx.drawImage(renderedA, 6, 26);
  ctx.drawImage(renderedB, halfW + 16, 26);

  // Meta line
  $legend.innerHTML = "";
  const el1 = document.createElement("span");
  el1.innerHTML = `<b>A</b>: ${resA.system_type} (${resA.compute_time_ms.toFixed(1)} ms)`;
  $legend.appendChild(el1);
  const el2 = document.createElement("span");
  el2.innerHTML = `<b>B</b>: ${resB.system_type} (${resB.compute_time_ms.toFixed(1)} ms)`;
  $legend.appendChild(el2);

  $meta.textContent = `compare: ${sysA} vs ${sysB} · A=${resA.compute_time_ms.toFixed(0)} ms, B=${resB.compute_time_ms.toFixed(0)} ms`;
  $raw.textContent = JSON.stringify({ A: resA, B: resB }, null, 2);
}

// ---- animation player wiring ----
(function() {
  const $play = document.getElementById("playBtn");
  const $scrub = document.getElementById("scrub");
  if (!$play || !$scrub) return;
  $play.addEventListener("click", () => {
    // lattice2d animation
    if (latticeFrames) {
      latticePlaying = !latticePlaying;
      $play.textContent = latticePlaying ? "❚❚ pause" : "▶ play";
      if (latticePlaying) {
        latticeTimer = setInterval(() => {
          latticeCurrentFrame = (latticeCurrentFrame + 1) % latticeFrames.length;
          drawLatticeFrame(latticeCurrentFrame);
        }, 100);
      } else {
        clearInterval(latticeTimer);
      }
      return;
    }
    // evolve animation (existing)
    if (!evolveFrames) return;
    evolvePlaying = !evolvePlaying;
    $play.textContent = evolvePlaying ? "❚❚ pause" : "▶ play";
    if (evolvePlaying) {
      evolveTimer = setInterval(() => {
        evolveCurrentFrame = (evolveCurrentFrame + 1) % evolveFrames.length;
        drawEvolveFrame(evolveCurrentFrame);
      }, 60);
    } else {
      clearInterval(evolveTimer);
    }
  });
  $scrub.addEventListener("input", (e) => {
    if (latticeFrames) {
      latticeCurrentFrame = parseInt(e.target.value, 10);
      drawLatticeFrame(latticeCurrentFrame);
      return;
    }
    evolveCurrentFrame = parseInt(e.target.value, 10);
    drawEvolveFrame(evolveCurrentFrame);
  });
})();


$permalink.addEventListener("click", async () => {
  if (!lastRunId) { $err.textContent = "run something first"; return; }
  const url = `${location.origin}/runs/${lastRunId}`;
  try {
    await navigator.clipboard.writeText(url);
    $permalink.textContent = "copied!";
    setTimeout(() => { $permalink.textContent = "copy permalink"; }, 1200);
  } catch (e) {
    $meta.textContent = `permalink: ${url}`;
  }
});

$run.addEventListener("click", runSim);
(async () => {
  renderParams();
  clearCanvas();
  refreshHistory();

  const q = new URLSearchParams(location.search);

  // Priority 1: ?scenario=<id> -- run a curated multi-step workflow
  const scenarioId = q.get("scenario");
  if (scenarioId) {
    await runScenario(scenarioId);
    return;
  }

  // Priority 2: ?ask=<prompt> -- run the intent parser
  const askPrompt = q.get("ask");
  if (askPrompt) {
    const inp = document.getElementById("askInput");
    if (inp) inp.value = askPrompt;
    await askQuestion();
    return;
  }

  // Priority 3: ?run=<uuid> -- load a specific past run
  const loaded = await loadRunFromURL();
  if (loaded) return;

  // Fallback: default particle run
  loadFromURL();
  runSim();
})();
